<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
    <header>
        <h1>Weather Dashbourd</h1>
    </header>

    <div class="search-section">
        <div class="search-bar">
            <input type="text"
             id="city-input"
             placeholder="Enter city name..."
             autocomplete="off"
             >
             <button id="search-btn">Search</button>
        </div>
        <div id="search-history" class="search-history" ></div>
    </div>
    <div id="loading" class="loading" hidden>
            <p>Fetching weather data...</p>
        </div>
    <div id="error-message" class="error-message" hidden >
        <p id="error-text"></p>
    </div>

    <div id="weather-display" class="weather-display" hidden>
        <div class="current-weather">
            <div class="current-main">
                <h2 id="city-name"></h2>
                <div class="temp-section">
                    <img src="" alt="weather-icon" id="weather-icon">
                    <span id="temperature" class="temperature"></span>
                </div>
                <p class="description" id="description"></p>
            </div>
            <div class="current-details">
                <div class="detail">
                    <span class="detail-label">Humidity</span>
                    <span id="humidity" class="detail-value" ></span>
                </div>
                <div class="detail">
                    <span class="detail-label">Wind</span>
                    <span id="wind" class="detail-value" ></span>
                </div>
                <div class="detail">
                    <span class="detail-label">feels</span>
                    <span id="feels-like" class="detail-value" ></span>
                </div>
            </div>

        </div>
        <div class="forecast-section">
            <h3>5-Day Forecast</h3>
            <div class="forecast-cards" id="forecast-cards"></div>
        </div>


    </div>

    

</div>
 <script src="script.js"></script>
</body>
</html>
